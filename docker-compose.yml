services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: podcast-manager-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data  # SQLite database persistence
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/podcast_manager.db
      - VIRTUAL_HOST=api-podcastmanager.uk
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=api-podcastmanager.uk
      - LETSENCRYPT_EMAIL=marcus.williams13@gmail.com
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portpilot_default
      - podcast-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: podcast-manager-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VIRTUAL_HOST=podcastmanager.uk
      - VIRTUAL_PORT=443
      - LETSENCRYPT_HOST=podcastmanager.uk
      - LETSENCRYPT_EMAIL=marcus.williams13@gmail.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - portpilot_default
      - podcast-network

networks:
  portpilot_default:
    external: true
  podcast-network:
    driver: bridge

volumes:
  data:
    driver: local
