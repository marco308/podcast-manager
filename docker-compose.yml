services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: podcast-manager-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # SQLite database persistence
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/podcast_manager.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - podcast-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: podcast-manager-web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - podcast-network

networks:
  podcast-network:
    driver: bridge

volumes:
  data:
    driver: local
