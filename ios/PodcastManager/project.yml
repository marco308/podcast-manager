# Local overrides (signing team, bundle ID, default server URL): copy
# Local.yml.example to Local.yml (gitignored) and run `xcodegen generate`.
# xcodegen 2.46 fails if Local.yml is missing, despite `optional: true`.
include:
  - path: Local.yml
    optional: true

name: PodcastManager
options:
  bundleIdPrefix: com.marcuslab
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Override per target in Local.yml to sign under your own bundle ID.
    APP_BUNDLE_ID: com.marcuslab.podcastmanager
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # iPhone only for v1 (issue #267): no iPad screenshots or iPad layout review.
    TARGETED_DEVICE_FAMILY: "1"

targets:
  PodcastManager:
    type: application
    platform: iOS
    sources:
      - PodcastManager
    resources:
      - path: PodcastManager/Resources
        excludes:
          - "**/.DS_Store"
    info:
      path: PodcastManager/Info.plist
      properties:
        # Build-time default backend URL; empty unless Local.yml sets
        # SERVER_URL_DEFAULT. Users can always override on the login screen.
        DefaultServerURL: "$(SERVER_URL_DEFAULT)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleName: $(PRODUCT_NAME)
        # Home-screen label; PRODUCT_NAME has no space.
        CFBundleDisplayName: Podcast Manager
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - podcastmanager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: PodcastManager
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize

  PodcastManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PodcastManagerTests
    dependencies:
      - target: PodcastManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PodcastManager:
    build:
      targets:
        PodcastManager: all
        PodcastManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PodcastManagerTests
    profile:
      config: Release
    archive:
      config: Release
