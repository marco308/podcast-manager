name: PodcastManager
options:
  bundleIdPrefix: com.marcuslab
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PodcastManager:
    type: application
    platform: iOS
    sources:
      - PodcastManager
    resources:
      - path: PodcastManager/Resources
        excludes:
          - "**/.DS_Store"
    info:
      path: PodcastManager/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - podcastmanager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.podcastmanager
        PRODUCT_NAME: PodcastManager
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z62E7MGREE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize

  PodcastManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PodcastManagerTests
    dependencies:
      - target: PodcastManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcuslab.podcastmanager.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PodcastManager:
    build:
      targets:
        PodcastManager: all
        PodcastManagerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PodcastManagerTests
    profile:
      config: Release
    archive:
      config: Release
