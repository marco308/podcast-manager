name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the dependabot-automerge job: a merge made with GITHUB_TOKEN
  # does not fire a push event, so without this the merged commit would never
  # get its :<sha> image published and deploy.sh could not pull it.
  workflow_dispatch:

# Read-only by default; the docker and dependabot-automerge jobs widen their
# own token below.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # 3.11 is the documented floor (ruff's target-version); 3.14 is what the
    # Docker image ships. Testing both keeps the README claim honest (issue #162).
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # ruff also covers scripts/ (tests/ still has pre-existing violations
      # and is excluded until it is cleaned up — see issue #178).
      - run: ruff check app scripts
      - run: ruff format --check app scripts
      - run: pytest tests --cov --cov-report=term --cov-report=json
      # One copy of the coverage report feeds the README badge (coverage-badge
      # job below); 3.14 because that is what the Docker image runs.
      - if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: backend/coverage.json
      # Prove the migration chain builds the schema the models declare on a
      # fresh database, matches them exactly (drift check), and can unwind
      # cleanly (issues #176/#178). Dummy env vars per tests/conftest.py.
      - name: Migration chain and drift check
        env:
          SPOTIFY_CLIENT_ID: test-client-id
          SPOTIFY_CLIENT_SECRET: test-client-secret
          ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/ci_migration_check.db
        run: |
          alembic upgrade head
          python -m scripts.check_migration_drift
          alembic downgrade base

  # Publish backend coverage as a shields.io endpoint JSON on the orphan
  # `badges` branch, which the README badge reads. Kept on its own branch so
  # main's history isn't a stream of bot commits, and done here rather than
  # through Codecov so there is no third-party account or token to manage.
  coverage-badge:
    needs: backend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Push badge JSON to the badges branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(jq -r '.totals.percent_covered_display' coverage.json)
          color=$(awk -v p="$pct" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 75 ? "green" : p >= 60 ? "yellow" : "red") }')
          jq -n --arg m "$pct%" --arg c "$color" \
            '{schemaVersion: 1, label: "coverage", message: $m, color: $c}' > coverage-badge.json
          git init -q badges && cd badges
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan badges
          cp ../coverage-badge.json .
          git add coverage-badge.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage ${pct}% at ${GITHUB_SHA::7}"
          # Force: the branch only ever holds the latest badge, one commit deep.
          git push -q --force origin badges

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # Build both images on every PR (the Dockerfiles are otherwise only
  # exercised at deploy time — issue #178) and publish them to GHCR on main.
  #
  # Publishing is what lets the deploy skip building on the swarm: the nodes
  # pull a finished image instead, and every node provably runs the same bits
  # rather than whatever each one happened to build locally (issue #169).
  # Each image gets both :latest and an immutable :<sha> tag, so a rollback
  # can name the exact prior build instead of re-pulling a moving :latest.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Third-party actions are pinned to a commit so a moved tag can't change
      # the code that gets GHCR write access; Dependabot bumps SHA and comment.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          # PRs build only; main (push or dispatch) builds and publishes.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/podcast-manager-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/podcast-manager-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Merge Dependabot minor/patch PRs once every job above has passed. Branch
  # protection (required checks) is not available on this private repo's plan,
  # so GitHub's native auto-merge would merge without waiting for CI — gating
  # on `needs` here is what makes "merge if green" actually hold.
  #
  # Skipped: semver-major bumps (human review), Docker base images (a
  # python:3.14 -> 3.15 tag counts as "minor" but only the build is exercised,
  # not the image at runtime) and GitHub Actions of any size (a new SHA is new
  # code that then runs on main with `packages: write`, so a human reads it
  # first — pinning to SHAs buys nothing if bumps merge themselves).
  dependabot-automerge:
    needs: [backend, frontend, docker]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # No concurrency group: GitHub keeps only one pending job per group and
    # cancels the rest, which silently dropped merges when several Dependabot
    # PRs finished CI together. Parallel merges are safe — a PR that conflicts
    # after another lands just fails `gh pr merge`, and Dependabot rebases it
    # (new head, new CI run, new merge attempt).
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge and publish
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          steps.meta.outputs.package-ecosystem != 'docker' &&
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          steps.meta.outputs.package-ecosystem != 'github-actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --match-head-commit: refuse if Dependabot pushed a rebase after
          # this CI run started (that rebase gets its own run and merge).
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run ci.yml --ref main
