name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in and what is awkward or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to happen? Sketch the UI, API, or setting if it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other ways this could be done.
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Backend (API / background jobs)
        - Frontend (web UI)
        - iOS app
        - Deployment (Docker / Swarm / Traefik)
  - type: checkboxes
    id: constraints
    attributes:
      label: Spotify API constraints
      description: Spotify removed the batch "Get Several ..." endpoints for Development Mode apps, and Dev Mode caps apps at 25 allowlisted users. Features that need those won't be feasible.
      options:
        - label: I have checked that this does not depend on a batch endpoint or on Extended Quota Mode
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
