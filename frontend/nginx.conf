# This file is included inside nginx's http {} block (conf.d/default.conf),
# so the map below is legal here.
#
# Cache-Control is chosen per path instead of with add_header inside each
# location: an add_header in a location drops every add_header inherited from
# the server block, which silently stripped the security headers wherever a
# location set its own. With one server-level set there is nothing to repeat.
#
# - /assets/ holds content-hashed files, so they never change: cache forever.
# - Everything else static (index.html via the SPA fallback, favicon) must be
#   revalidated, or a browser keeps an old index.html after a deploy that
#   points at hashed assets the new image no longer has — a blank page.
# - /api and /health send nothing: an empty value makes add_header skip the
#   header, so the backend's own caching headers are left alone.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api      "";
    /health     "";
    default     "no-cache";
}

server {
    # Unprivileged port so the container can run as a non-root user.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (docker-stack-traefik.example.yml) the peer is the proxy
    # on a private Docker network, so take the client address from the
    # X-Forwarded-For it sets, walking right to left past trusted hops. A
    # client connecting directly from a public address is never trusted, so
    # it can't choose its own $remote_addr.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers. These apply to every location below because none of
    # them uses add_header — keep it that way (see the map above).
    #
    # HSTS assumes this is served via HTTPS behind Traefik. No includeSubDomains
    # or preload: a self-hoster's other subdomains may not all be HTTPS, and
    # preload is a commitment for the whole registrable domain.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Login is a top-level navigation to /api/auth/login (no form post) and
    # the app is never framed, so form-action/frame-ancestors can be tight.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://i.scdn.co data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Cache-Control $cache_control always;

    # Block source maps in production — defense-in-depth if a build ever ships them by mistake.
    location ~ \.map$ {
        deny all;
        return 404;
    }

    # API proxy to backend
    location /api {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, don't append: the backend trusts X-Forwarded-For for its
        # per-IP rate limits, and appending would pass on whatever a client
        # put there. $remote_addr is already the real client (realip above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        # POST /api/playlists/{id}/run and /api/playlists/run-all rebuild
        # synchronously and back off on Spotify 429s, so they can take
        # minutes. A 30s read timeout turned a run that succeeded into a 504.
        proxy_read_timeout 300s;
    }

    # Hashed build output. A missing file is a 404 rather than the SPA
    # fallback, so a stale reference never gets index.html back as a script.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
